<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Práctica Sass en Ionic & Angular</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="home-container">
    
    <!-- 4. Título en rojo, mayúsculas, centrado -->
    <h1 class="page-title">Bienvenido a Ionic con Sass</h1>

    <!-- 5. Botón a la derecha en azul -->
    <div class="button-wrapper">
      <ion-button class="custom-btn" shape="round">
        Botón Azul a la Derecha
      </ion-button>
    </div>

    <!-- 6. Imagen centrada con borde en verde de grosor 3px -->
    <div class="image-wrapper">
      <img
        class="custom-image"
        src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=800&q=80"
        alt="Desarrollo de Interfaces con Ionic y Sass"
      />
    </div>

  </div>
</ion-content>
